<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DIRP — Distributed Incident Response</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #141922; --panel2: #1b212d; --border: #232b3a;
    --text: #e6edf3; --muted: #8b98a9; --accent: #4f8cff; --ok: #3fb950;
    --warn: #d29922; --crit: #f85149; --p1: #f85149; --p2: #d29922; --p3: #4f8cff; --p4: #8b98a9;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 12px; padding: 16px 24px;
    border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header .badge { font-size: 11px; color: var(--muted); border: 1px solid var(--border);
    padding: 2px 8px; border-radius: 999px; }
  header .live { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(63,185,80,.6);
    animation: pulse 2s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(63,185,80,.5)} 70%{box-shadow:0 0 0 8px rgba(63,185,80,0)} 100%{box-shadow:0 0 0 0 rgba(63,185,80,0)} }
  main { display: grid; grid-template-columns: 1fr 1.1fr; gap: 16px; padding: 16px 24px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 900px){ main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
    margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .services { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); }
  .svc { background: var(--panel); padding: 14px 16px; }
  .svc .name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .svc .name .health { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .svc.deg .name .health { background: var(--crit); }
  .svc .metrics { display: flex; gap: 16px; margin-top: 8px; color: var(--muted); font-size: 12px; }
  .svc .metrics b { color: var(--text); font-variant-numeric: tabular-nums; }
  .svc.deg .metrics b { color: var(--crit); }
  .edges { padding: 8px 16px 16px; }
  .edge { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; border-bottom: 1px dashed var(--border); }
  .edge:last-child { border-bottom: none; }
  .edge .arrow { color: var(--muted); }
  .edge .err { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .edge.bad .err { color: var(--crit); }
  .incidents { display: flex; flex-direction: column; }
  .empty { padding: 32px 16px; text-align: center; color: var(--muted); }
  .inc { border-bottom: 1px solid var(--border); padding: 16px; }
  .inc:last-child { border-bottom: none; }
  .inc .top { display: flex; align-items: center; gap: 10px; }
  .sev { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
  .sev.P1 { background: rgba(248,81,73,.15); color: var(--p1); }
  .sev.P2 { background: rgba(210,153,34,.15); color: var(--p2); }
  .sev.P3 { background: rgba(79,140,255,.15); color: var(--p3); }
  .sev.P4 { background: rgba(139,152,169,.15); color: var(--p4); }
  .inc .id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .inc .status { margin-left: auto; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .inc .status.resolved { color: var(--ok); }
  .inc .title { margin: 8px 0 12px; font-size: 15px; font-weight: 600; }
  .section { margin-top: 12px; }
  .section .label { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 6px; }
  .evidence li { color: var(--text); font-size: 13px; margin: 3px 0; list-style: none; padding-left: 16px; position: relative; }
  .evidence li::before { content: "▪"; position: absolute; left: 0; color: var(--warn); }
  .rc { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
  .rc .head { display: flex; align-items: center; gap: 8px; }
  .rc .head .spark { color: var(--accent); }
  .rc .source { margin-left: auto; font-size: 10px; text-transform: uppercase; letter-spacing: .5px;
    border: 1px solid var(--border); padding: 1px 6px; border-radius: 999px; color: var(--muted); }
  .rc .source.ai { color: var(--accent); border-color: rgba(79,140,255,.4); }
  .rc .origin { font-weight: 600; margin: 8px 0 4px; }
  .rc .summary { color: var(--muted); font-size: 13px; }
  .rc ol { margin: 10px 0 0; padding-left: 20px; }
  .rc ol li { margin: 4px 0; font-size: 13px; }
  .rc .conf { font-size: 11px; color: var(--muted); margin-top: 8px; }
  .analyzing { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-size: 12px; }
  .analyzing::after { content: "●●●"; letter-spacing: 2px; animation: blink 1.4s infinite; }
  @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }
</style>
</head>
<body>
<header>
  <h1>🛰️ DIRP</h1>
  <span class="badge">AI-Powered Distributed Incident Response</span>
  <div class="live"><span class="dot"></span> live</div>
</header>
<main>
  <div style="display:flex; flex-direction:column; gap:16px;">
    <div class="card">
      <h2>Service Health</h2>
      <div class="services" id="services"><div class="empty">waiting for telemetry…</div></div>
    </div>
    <div class="card">
      <h2>Dependency Graph</h2>
      <div class="edges" id="edges"><div class="empty">no traces yet</div></div>
    </div>
  </div>
  <div class="card">
    <h2>Incidents</h2>
    <div class="incidents" id="incidents"><div class="empty">✅ all systems nominal</div></div>
  </div>
</main>

<script>
const fmtPct = v => (v * 100).toFixed(1) + "%";
const fmtMs  = v => (v * 1000).toFixed(0) + "ms";

function renderServices(list) {
  const el = document.getElementById("services");
  if (!list.length) { el.innerHTML = '<div class="empty">waiting for telemetry…</div>'; return; }
  el.innerHTML = list.map(s => {
    const deg = s.error_rate > 0.05 || (s.db_max > 0 && s.db_in_use / s.db_max >= 0.9);
    const pool = s.db_max > 0 ? `<span>pool <b>${s.db_in_use}/${s.db_max}</b></span>` : "";
    return `<div class="svc ${deg ? "deg" : ""}">
      <div class="name"><span class="health"></span>${s.service.replace("-service","")}</div>
      <div class="metrics">
        <span>err <b>${fmtPct(s.error_rate)}</b></span>
        <span>p99 <b>${fmtMs(s.p99_latency)}</b></span>
        ${pool}
      </div></div>`;
  }).join("");
}

function renderEdges(edges) {
  const el = document.getElementById("edges");
  if (!edges || !edges.length) { el.innerHTML = '<div class="empty">no traces yet</div>'; return; }
  el.innerHTML = edges.map(e => {
    const bad = e.error_count > 0;
    const errs = bad ? `${e.error_count} err` : `${e.call_count} ok`;
    return `<div class="edge ${bad ? "bad" : ""}">
      <span>${e.from.replace("-service","")}</span>
      <span class="arrow">→</span>
      <span>${e.to.replace("-service","")}</span>
      <span class="err">${errs} · p99 ${fmtMs(e.p99_latency)}</span></div>`;
  }).join("");
}

function renderIncident(inc) {
  const resolved = inc.status === "resolved";
  const ev = (inc.evidence || []).map(e => `<li>${e.detail} <span style="color:var(--muted)">(${e.service.replace("-service","")})</span></li>`).join("");
  let rc = "";
  if (inc.root_cause) {
    const r = inc.root_cause;
    const rem = (r.remediation || []).map(x => `<li>${x}</li>`).join("");
    rc = `<div class="rc">
      <div class="head"><span class="spark">✦</span> Root Cause Analysis
        <span class="source ${r.source}">${r.source === "ai" ? "AI · Claude" : "heuristic"}</span></div>
      <div class="origin">${r.service.replace("-service","")}</div>
      <div class="summary">${r.summary}</div>
      ${rem ? `<div class="section"><div class="label">Suggested remediation</div><ol>${rem}</ol></div>` : ""}
      <div class="conf">confidence ${(r.confidence * 100).toFixed(0)}%</div>
    </div>`;
  } else if (!resolved) {
    rc = `<div class="rc"><span class="analyzing">Analyzing root cause</span></div>`;
  }
  return `<div class="inc">
    <div class="top">
      <span class="sev ${inc.severity}">${inc.severity}</span>
      <span class="id">${inc.id}</span>
      <span class="status ${resolved ? "resolved" : ""}">${resolved ? "resolved" : inc.status.replace(/_/g," ")}</span>
    </div>
    <div class="title">🚨 ${inc.title}</div>
    ${ev ? `<div class="section"><div class="label">Evidence</div><ul class="evidence">${ev}</ul></div>` : ""}
    ${rc}
  </div>`;
}

const incidents = new Map();
function renderIncidents() {
  const el = document.getElementById("incidents");
  const list = [...incidents.values()].sort((a,b) => (a.opened_at < b.opened_at ? 1 : -1));
  if (!list.length) { el.innerHTML = '<div class="empty">✅ all systems nominal</div>'; return; }
  el.innerHTML = list.map(renderIncident).join("");
}

async function poll() {
  try {
    const [svc, graph, incs] = await Promise.all([
      fetch("/api/services").then(r => r.json()),
      fetch("/api/graph").then(r => r.json()),
      fetch("/api/incidents").then(r => r.json()),
    ]);
    renderServices(svc);
    renderEdges(graph.edges);
    (incs || []).forEach(i => incidents.set(i.id, i));
    renderIncidents();
  } catch (e) { /* transient; retry next tick */ }
}

// Live incident updates via SSE.
const es = new EventSource("/api/stream");
es.onmessage = ev => {
  try { const inc = JSON.parse(ev.data); incidents.set(inc.id, inc); renderIncidents(); } catch {}
};

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
