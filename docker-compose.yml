# Full DIRP demo stack: 5 sample microservices, the incident platform, and the
# real observability tooling (Prometheus for metrics, Grafana for dashboards,
# TimescaleDB for persistence).
#
#   docker compose up --build
#   open http://localhost:8080        # DIRP incident dashboard
#   ./scripts/demo.sh                 # inject the failure and watch it diagnosed
#
# Set ANTHROPIC_API_KEY in your environment to enable Claude-backed root-cause
# analysis; without it the platform uses its deterministic heuristic.

x-service-image: &service-image
  build:
    context: .
    dockerfile: Dockerfile

services:
  # --- Sample microservices (the "victim" system) -------------------------
  notification:
    <<: *service-image
    entrypoint: ["/bin/notification"]
    environment:
      NOTIFICATION_ADDR: ":8085"
      OTLP_ENDPOINT: "platform:4317"

  ledger:
    <<: *service-image
    entrypoint: ["/bin/ledger"]
    environment:
      LEDGER_ADDR: ":8084"
      NOTIFICATION_URL: "http://notification:8085"
      OTLP_ENDPOINT: "platform:4317"
    depends_on: [notification]

  payment:
    <<: *service-image
    entrypoint: ["/bin/payment"]
    ports:
      - "8083:8083" # exposed so scripts/demo.sh can inject the fault
    environment:
      PAYMENT_ADDR: ":8083"
      LEDGER_URL: "http://ledger:8084"
      PAYMENT_DB_MAX_CONNS: "10"
      OTLP_ENDPOINT: "platform:4317"
    depends_on: [ledger]

  order:
    <<: *service-image
    entrypoint: ["/bin/order"]
    environment:
      ORDER_ADDR: ":8082"
      PAYMENT_URL: "http://payment:8083"
      OTLP_ENDPOINT: "platform:4317"
    depends_on: [payment]

  user:
    <<: *service-image
    entrypoint: ["/bin/user"]
    environment:
      USER_ADDR: ":8081"
      ORDER_URL: "http://order:8082"
      OTLP_ENDPOINT: "platform:4317"
      LOAD_RPS: "12" # built-in baseline load generator
    depends_on: [order]

  # --- The incident platform (control plane) ------------------------------
  platform:
    <<: *service-image
    entrypoint: ["/bin/platform"]
    ports:
      - "8080:8080" # dashboard + API
      - "4317:4317" # OTLP trace receiver
    environment:
      PLATFORM_ADDR: ":8080"
      PLATFORM_OTLP_ADDR: ":4317"
      STORE_DSN: "postgres://dirp:dirp@timescaledb:5432/dirp?sslmode=disable"
      SCRAPE_TARGETS: "user-service=http://user:8081/metrics,order-service=http://order:8082/metrics,payment-service=http://payment:8083/metrics,ledger-service=http://ledger:8084/metrics,notification-service=http://notification:8085/metrics"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    depends_on: [timescaledb]

  # --- Real observability tooling -----------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: dirp
      POSTGRES_PASSWORD: dirp
      POSTGRES_DB: dirp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dirp"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [user, order, payment, ledger, notification]

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_PASSWORD: "dirp"
    volumes:
      - ./deploy/grafana-datasource.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
    depends_on: [prometheus]
